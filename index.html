<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Contacto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- PASO 1 -->
  <div id="step-1" class="step">
    <header class="app-header">
      <div class="logo">📋</div>
      <h1>QR Contacto</h1>
      <p class="tagline" data-i18n="tagline"></p>

      <div class="header-controls">
        <div class="lang-switcher">
          <button class="lang-btn" data-lang="es">ES</button>
          <button class="lang-btn" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="pt">PT</button>
        </div>
        <div id="auth-bar" class="auth-bar">
          <button id="btn-signin" class="btn btn-primary btn-sm" data-i18n="auth.signin"></button>
          <button id="user-pill" class="user-pill" style="display:none">
            <div id="pill-avatar" class="avatar-sm"></div>
            <span id="pill-name"></span>
          </button>
        </div>
      </div>
    </header>

    <div class="card">
      <h2 data-i18n="s1.title"></h2>
      <p class="hint" data-i18n="s1.hint"></p>

      <div class="field">
        <label for="project-name" data-i18n="s1.label"></label>
        <input type="text" id="project-name" data-i18n-ph="s1.ph" autocomplete="off" maxlength="50">
      </div>

      <div id="name-error" class="alert alert-error" style="display:none"></div>
      <div id="anon-notice" class="alert alert-info" style="display:none" data-i18n="auth.anonLimit"></div>

      <button id="btn-continue" class="btn btn-primary btn-full" data-i18n="s1.btn"></button>
    </div>

    <div id="existing-projects-section" class="card" style="display:none">
      <h3 data-i18n="s1.saved"></h3>
      <div id="existing-projects-list"></div>
    </div>
  </div>

  <!-- PASO 2 -->
  <div id="step-2" class="step" style="display:none">
    <div class="step-nav">
      <button id="btn-back" class="btn-back">←</button>
      <span class="project-badge" id="project-badge"></span>
      <span id="step2-mode-label" class="edit-label"></span>
    </div>

    <div class="card">
      <h2 data-i18n="s2.title"></h2>
      <p class="hint" data-i18n="s2.hint"></p>

      <div class="field">
        <label for="f-name">
          <span data-i18n="s2.name"></span> <span class="req">*</span>
        </label>
        <input type="text" id="f-name" data-i18n-ph="s2.name.ph">
      </div>

      <div class="field">
        <label for="f-email" data-i18n="s2.email"></label>
        <input type="email" id="f-email" data-i18n-ph="s2.email.ph">
      </div>

      <div class="field">
        <label for="f-whatsapp" data-i18n="s2.wa"></label>
        <div class="input-group">
          <span class="input-addon">+</span>
          <input type="tel" id="f-whatsapp" data-i18n-ph="s2.wa.ph">
        </div>
      </div>

      <div class="field">
        <label data-i18n="s2.instr"></label>
        <div class="editor-box">
          <div class="toolbar" id="editor-toolbar">
            <button class="tool-btn" data-cmd="bold"><b>B</b></button>
            <button class="tool-btn" data-cmd="italic"><i>I</i></button>
            <button class="tool-btn" data-cmd="underline"><u>U</u></button>
            <span class="tool-sep"></span>
            <button class="tool-btn" data-cmd="fontSize" data-val="5">A+</button>
            <button class="tool-btn" data-cmd="fontSize" data-val="2">A−</button>
            <span class="tool-sep"></span>
            <button class="tool-btn" data-cmd="insertUnorderedList" data-i18n="toolbar.bullet"></button>
            <button class="tool-btn" data-cmd="insertOrderedList" data-i18n="toolbar.numbered"></button>
          </div>
          <div class="editor" id="f-instructions" contenteditable="true"
               data-i18n-dp="s2.instr.ph"></div>
          <div class="editor-footer">
            <span id="char-counter" class="char-counter">0</span>
          </div>
        </div>
      </div>

      <div id="extra-fields"></div>

      <div class="add-field-ui">
        <button id="btn-add-field" class="btn btn-ghost btn-add">
          <span class="plus-icon">+</span>
          <span data-i18n="s2.addField"></span>
        </button>
        <div id="add-field-form" class="add-field-form" style="display:none">
          <input type="text" id="new-field-label" data-i18n-ph="s2.addField.ph" maxlength="40">
          <div class="add-field-actions">
            <button id="btn-confirm-add" class="btn btn-primary btn-sm" data-i18n="s2.addField.ok"></button>
            <button id="btn-cancel-add"  class="btn btn-ghost btn-sm"   data-i18n="s2.addField.cancel"></button>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button id="btn-generate" class="btn btn-primary btn-full" data-i18n="s2.save"></button>
      </div>
    </div>
  </div>

  <!-- PASO 3 -->
  <div id="step-3" class="step" style="display:none">
    <div class="card qr-card">
      <div class="success-badge" data-i18n="s3.saved"></div>
      <h2 data-i18n="s3.title"></h2>

      <div id="qr-mode-toggle" class="qr-mode-toggle" style="display:none">
        <button class="qr-mode-btn" id="btn-mode-mini">
          <span data-i18n="mode.mini"></span><span class="mode-tag">21×21</span>
        </button>
        <button class="qr-mode-btn" id="btn-mode-full">
          <span data-i18n="mode.full"></span><span class="mode-tag">25×25</span>
        </button>
      </div>
      <p id="qr-mode-desc" class="qr-mode-desc"></p>

      <div class="print-area" id="print-area">
        <div class="qr-wrapper">
          <p class="qr-project-label" id="qr-label"></p>
          <div id="qr-loading" class="qr-loading" style="display:none">
            <div class="spinner-sm"></div>
            <p data-i18n="s3.loading"></p>
          </div>
          <div id="qr-code"></div>
          <p class="qr-scan-hint" data-i18n="s3.scan"></p>
        </div>
      </div>

      <div class="qr-actions">
        <button onclick="window.print()" class="btn btn-primary" data-i18n="s3.print"></button>
        <button id="btn-copy-link" class="btn btn-secondary" data-i18n="s3.copy"></button>
      </div>

      <div class="qr-url-display">
        <label data-i18n="s3.urlLabel"></label>
        <div class="url-box" id="qr-url-box"></div>
      </div>

      <hr class="divider">
      <div class="step3-actions">
        <button id="btn-create-another" class="btn btn-ghost" data-i18n="s3.another"></button>
        <button id="btn-view-all"       class="btn btn-ghost" data-i18n="s3.viewAll"></button>
      </div>
    </div>
  </div>

</div><!-- /.app -->

<!-- ══════════════════════════════════════════
     MODAL — Auth
══════════════════════════════════════════ -->
<div id="modal-auth" class="modal-overlay" style="display:none">
  <div class="modal-card">
    <button class="modal-close" id="btn-close-auth">✕</button>
    <h2 data-i18n="auth.signin"></h2>

    <button id="btn-google" class="btn btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      <span data-i18n="auth.google"></span>
    </button>

    <div class="or-divider"><span data-i18n="auth.or"></span></div>

    <div class="tab-switcher">
      <button class="tab-btn active" data-tab="login" data-i18n="auth.login"></button>
      <button class="tab-btn"        data-tab="register" data-i18n="auth.register"></button>
    </div>

    <div id="tab-login">
      <div class="field">
        <input type="email"    id="auth-email" data-i18n-ph="auth.email.ph">
      </div>
      <div class="field">
        <input type="password" id="auth-pass"  data-i18n-ph="auth.pass.ph">
      </div>
      <div id="auth-error" class="alert alert-error" style="display:none"></div>
      <button id="btn-login" class="btn btn-primary btn-full" data-i18n="auth.login"></button>
    </div>

    <div id="tab-register" style="display:none">
      <div class="field">
        <input type="text"     id="auth-name"     data-i18n-ph="auth.name.ph">
      </div>
      <div class="field">
        <input type="email"    id="auth-email-reg" data-i18n-ph="auth.email.ph">
      </div>
      <div class="field">
        <input type="password" id="auth-pass-reg"  data-i18n-ph="auth.pass.reg.ph">
      </div>
      <div id="auth-error-reg" class="alert alert-error" style="display:none"></div>
      <button id="btn-register" class="btn btn-primary btn-full" data-i18n="auth.register"></button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     MODAL — Profile
══════════════════════════════════════════ -->
<div id="modal-profile" class="modal-overlay" style="display:none">
  <div class="modal-card">
    <button class="modal-close" id="btn-close-profile">✕</button>
    <h2 data-i18n="auth.profile"></h2>

    <div class="profile-avatar-section">
      <div id="profile-photo-preview" class="profile-avatar"></div>
      <label class="btn btn-secondary btn-sm" for="profile-photo-input" data-i18n="auth.changePhoto"></label>
      <input type="file" id="profile-photo-input" accept="image/*" style="display:none">
    </div>

    <div class="field">
      <label data-i18n="auth.displayName"></label>
      <input type="text"  id="profile-name"  data-i18n-ph="auth.name.ph">
    </div>
    <div class="field">
      <label data-i18n="auth.emailLabel"></label>
      <input type="email" id="profile-email" disabled>
    </div>

    <div id="profile-error" class="alert alert-error" style="display:none"></div>

    <button id="btn-save-profile" class="btn btn-primary btn-full" data-i18n="auth.saveProfile"></button>
    <button id="btn-signout"      class="btn btn-ghost   btn-full" data-i18n="auth.signout"></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="i18n.js"></script>
<script src="firebase.js"></script>
<script src="app.js"></script>
</body>
</html>
