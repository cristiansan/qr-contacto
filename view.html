<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Contacto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="viewer-body">
<div class="viewer-container">

  <div id="loading" class="viewer-loading">
    <div class="spinner"></div>
    <p data-i18n="v.loading"></p>
  </div>

  <div id="contact-card" class="contact-card" style="display:none">
    <div class="contact-header">
      <div class="contact-avatar" id="contact-avatar"></div>
      <div class="contact-identity">
        <h1 id="contact-name"></h1>
        <p class="contact-project" id="contact-project"></p>
      </div>
      <div class="viewer-qr-wrap">
        <div id="viewer-qr"></div>
      </div>
    </div>

    <div class="contact-body">
      <div id="row-email" class="contact-row" style="display:none">
        <div class="contact-icon">✉️</div>
        <div class="contact-info">
          <span class="contact-label" data-i18n="v.email"></span>
          <a id="val-email" class="contact-value" href="#"></a>
        </div>
      </div>

      <div id="row-whatsapp" class="contact-row" style="display:none">
        <div class="contact-icon">💬</div>
        <div class="contact-info">
          <span class="contact-label" data-i18n="v.whatsapp"></span>
          <a id="val-whatsapp" class="contact-value" href="#" target="_blank" rel="noopener"></a>
        </div>
      </div>

      <div id="row-instructions" class="contact-section" style="display:none">
        <h3 class="section-title" data-i18n="v.instructions"></h3>
        <div id="val-instructions" class="instructions-content"></div>
      </div>

      <div id="extra-fields-view"></div>
    </div>

    <div id="whatsapp-cta" class="whatsapp-cta" style="display:none">
      <a id="whatsapp-btn" href="#" target="_blank" rel="noopener" class="btn btn-whatsapp" data-i18n="v.wa.cta"></a>
    </div>

    <div class="contact-footer">
      <p>
        <span data-i18n="v.footer"></span>
        <a href="index.html">QR Contacto</a>
      </p>
      <div class="lang-switcher-sm">
        <button class="lang-btn" data-lang="es">ES</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="pt">PT</button>
      </div>
    </div>
  </div>

  <div id="error-view" class="error-card" style="display:none">
    <div class="error-icon">⚠️</div>
    <h2 data-i18n="v.err.title"></h2>
    <p data-i18n="v.err.msg"></p>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="i18n.js"></script>
<script src="firebase.js"></script>
<script src="viewer.js"></script>
</body>
</html>
